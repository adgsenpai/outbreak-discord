<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font:14px system-ui;background:#101827;color:#f1f5f9;width:320px;padding:18px;margin:0}h2{margin:0 0 6px}p{color:#a8b5c8}label{display:block;margin:14px 0 5px}input[type=text],input[type=password]{box-sizing:border-box;width:100%;padding:10px;background:#1f2937;color:white;border:1px solid #475569;border-radius:8px}button{background:#6366f1;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;margin-top:12px}#status{padding:10px;background:#1f2937;border-radius:8px;margin-top:12px;overflow-wrap:anywhere}.toggle{display:flex;gap:8px;align-items:center}</style></head><body>
<h2>🎮 Outbreak Discord</h2><p>File 1 + File 2 Rich Presence</p>
<label class="toggle"><input id="enabled" type="checkbox"> Enable activity tracking</label>
<label for="token">Companion pairing token</label><input id="token" type="password" placeholder="Paste token from companion">
<label for="username">Your Outbreak online player name</label><input id="username" type="text" placeholder="Exact username from Settings → Online">
<label class="toggle"><input id="shareRoom" type="checkbox"> Show my room in Discord (opt-in)</label>
<button id="save">Save & connect</button><div id="status">Checking connection…</div><script src="popup.js"></script></body></html>
